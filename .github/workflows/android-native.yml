name: Android native validation

on:
  push:
    branches:
      - codex/native-android
  pull_request:
    paths:
      - "flutter_ui/**"
      - "mobile/**"
      - "pkg/**"
      - "protocol/**"
      - "scripts/package-android.sh"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WING_VERSION: "1.0.6.2"
  FLUTTER_VERSION: "3.29.2"
  FLUTTER_BUILD_NUMBER: "10062"
  GOPROXY: "https://proxy.golang.org,direct"
  GONOSUMDB: "github.com/sagernet/*"

jobs:
  test-and-build:
    name: Test and build standalone APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Test Go backend
        run: go test ./pkg/webui ./pkg/sub ./protocol

      - name: Test native Flutter interface
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build universal standalone APK
        run: bash scripts/package-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wing-android-native-${{ github.sha }}
          path: dist/wing-${{ env.WING_VERSION }}-android-universal.apk
          if-no-files-found: error
