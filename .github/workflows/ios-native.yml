name: Native iOS validation

on:
  push:
    branches:
      - codex/native-ios
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.29.2"
  FLUTTER_BUILD_NAME: "1.0.6"
  FLUTTER_BUILD_NUMBER: "10062"
  WING_VERSION: "1.0.6.2"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install iOS build tools
        run: |
          go install -tool golang.org/x/mobile/cmd/gobind
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          gem install xcodeproj --no-document
      - name: Analyze and test Flutter UI
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build unsigned native IPA
        run: |
          set -o pipefail
          if ! bash scripts/package-ios.sh >ios-build.log 2>&1; then
            tail -n 100 ios-build.log
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error file=scripts/package-ios.sh,line=1::$line"
            done < <(tail -n 20 ios-build.log)
            exit 1
          fi
          tail -n 30 ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wing-ios-native-build-log
          path: ios-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: wing-ios-native-unsigned
          path: dist/wing-${{ env.WING_VERSION }}-ios-unsigned.ipa
