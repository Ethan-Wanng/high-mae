name: Native iOS validation

on:
  push:
    branches:
      - codex/native-ios
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.29.2"
  FLUTTER_BUILD_NAME: "1.0.6"
  FLUTTER_BUILD_NUMBER: "10062"
  WING_VERSION: "1.0.6.2"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install iOS build tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gem install xcodeproj --no-document
      - name: Analyze and test Flutter UI
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build unsigned native IPA
        run: bash scripts/package-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wing-ios-native-unsigned
          path: dist/wing-${{ env.WING_VERSION }}-ios-unsigned.ipa
