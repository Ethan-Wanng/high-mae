name: Release installers

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  WING_VERSION: "1.0.7.3"
  FLUTTER_VERSION: "3.29.2"
  FLUTTER_BUILD_NUMBER: "10073"
  GOPROXY: "https://proxy.golang.org,direct"
  GONOSUMDB: "github.com/sagernet/*"

jobs:
  windows:
    name: Windows installer
    # Flutter 3.29.2 expects the VS 2022 Windows desktop toolchain.
    runs-on: windows-2022
    env:
      # Flutter Windows plugin symlinks fail when Pub cache lives on another drive.
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          choco install innosetup --no-progress -y
          .\scripts\mk.ps1 build
          .\scripts\sign-windows.ps1 .\build\bin\wing.exe .\build\bin\libcronet.dll .\build\bin\flutter_ui\wing_ui.exe
          .\scripts\package.ps1
          $setupExe = "dist\wing-$($env:WING_VERSION)-windows-x64-setup.exe"
          $setupZip = "dist\wing-$($env:WING_VERSION)-windows-x64-setup.zip"
          .\scripts\sign-windows.ps1 $setupExe
          Compress-Archive -LiteralPath $setupExe -DestinationPath $setupZip -CompressionLevel Optimal -Force
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item $setupExe "artifacts\wing-$($env:WING_VERSION)-windows-x64-setup.exe" -Force
          Copy-Item $setupZip "artifacts\wing-$($env:WING_VERSION)-windows-x64-setup.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: wing-windows
          path: |
            artifacts/wing-${{ env.WING_VERSION }}-windows-x64-setup.exe
            artifacts/wing-${{ env.WING_VERSION }}-windows-x64-setup.zip

  linux:
    name: Linux installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux installer
        run: |
          bash scripts/package-linux.sh
          mkdir -p artifacts
          cp "dist/wing-${WING_VERSION}-linux-x64.run" artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: wing-linux
          path: artifacts/wing-${{ env.WING_VERSION }}-linux-x64.run

  macos:
    name: macOS installer
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS pkg
        run: |
          bash scripts/package-macos.sh
          mkdir -p artifacts
          cp "dist/wing-${WING_VERSION}-macos-x64.pkg" artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: wing-macos
          path: artifacts/wing-${{ env.WING_VERSION }}-macos-x64.pkg

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Android APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          bash scripts/package-android.sh
          cp "dist/wing-${WING_VERSION}-android-universal.apk" "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: wing-android
          path: artifacts/wing-${{ env.WING_VERSION }}-android-universal.apk

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    # The native iOS client is still in progress; a failed IPA build must not block
    # the desktop and Android release assets.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install iOS build tools
        run: |
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          gem install xcodeproj --no-document

      - name: Build unsigned iOS IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          bash scripts/package-ios.sh
          cp "dist/wing-${WING_VERSION}-ios-unsigned.ipa" "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: wing-ios
          path: artifacts/wing-${{ env.WING_VERSION }}-ios-unsigned.ipa

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux
      - macos
      - android
      - ios
    # Publish when every required platform succeeded; the iOS IPA is attached only if it built.
    if: >-
      ${{ !cancelled() &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.android.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.WING_VERSION }}
          name: wing v${{ env.WING_VERSION }}
          body: |
            wing v${{ env.WING_VERSION }} release assets.

            Assets:
            - Windows (installer): wing-${{ env.WING_VERSION }}-windows-x64-setup.exe
            - Windows (zip archive, recommended for Edge/browser downloads): wing-${{ env.WING_VERSION }}-windows-x64-setup.zip
            - Linux: wing-${{ env.WING_VERSION }}-linux-x64.run
            - macOS: wing-${{ env.WING_VERSION }}-macos-x64.pkg
            - Android: wing-${{ env.WING_VERSION }}-android-universal.apk
            - Checksums: SHA256SUMS.txt
            ${{ hashFiles('artifacts/*.ipa') != '' && format('- iOS: wing-{0}-ios-unsigned.ipa', env.WING_VERSION) || '- iOS: not included in this release (native iOS build in progress)' }}

            Notes:
            - Improves Android VPN stability, crash safety, smoothness, and memory usage: adds START_STICKY/task persistence, a backend health watchdog that re-attaches the TUN FD without dropping VPN, validated underlying network switching (Wi-Fi/Cellular), strict 64MiB Go memory limit + bounded caches/concurrency, direct in-process SOCKS5 relay, lifecycle-aware polling, and lazy virtualized routing rule lists.
            - Reduces Edge/Windows Security false positives: adds an in-app direct updater (avoids browser Zone.Identifier/SmartScreen tags), embeds PE version/manifest/icon metadata and symbol tables in wing.exe, removes hidden PowerShell Bypass calls from the installer, and provides a .zip archive and SHA256SUMS.txt alongside the .exe setup. If downloading manually in Edge, prefer the .zip archive.
            - Includes 1.0.7.2: Fixes domestic direct traffic (such as Douyin) lagging or routing through the proxy in TUN + Proxy mode via direct physical-adapter DoH/UDP, 30-minute TUN IP-to-domain mapping TTL floor, and expanded ByteDance/Volcano CDN direct rules.
            - Includes 1.0.7.1: Clash Party-style URLTest latency checks, live node IP probing, IPv6 fallback to IPv4, IME-safe node search, and Hysteria2 pinSHA256 support.
            ${{ hashFiles('artifacts/*.ipa') != '' && '- The iOS IPA is unsigned and must be signed with an Apple Developer certificate before device distribution.' || '' }}
          files: artifacts/*
          overwrite_files: true
